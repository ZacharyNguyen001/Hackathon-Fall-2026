# FILE PURPOSE: builds the game and publishes it to GitHub Pages every time `main` changes.
# One-time setup by the repo owner: GitHub -> Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# It only runs our own build (npm ci, npm test, npm run build); it adds no outside service to the game.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you click "Run workflow" by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # vite base is './', so it works under /<repo-name>/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
